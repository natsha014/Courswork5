name: Django CI/CD with poetry

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry and Dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --no-root

      - name: Run flake8
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run flake8 .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry & Dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --no-root

      - name: Run Tests
        env:
          SECRET_KEY: 'test-key-123'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp-web:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp-web:latest
          
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp-nginx:latest ./nginx
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp-nginx:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            git fetch origin
            git reset --hard origin/feature/ci_cd
            docker compose pull
            docker compose up -d
            docker compose exec -T web poetry run python manage.py collectstatic --noinput
            docker compose exec -T web poetry run python manage.py migrate
